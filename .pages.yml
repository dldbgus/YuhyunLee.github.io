# Open https://app.pagescms.org and select this repository to edit your website.
media:
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  categories: [image, document]
content:
  - name: site
    label: 01 · About & contact
    type: file
    path: data/site.json
    format: json
    fields:
      - { name: name, label: Full name, type: string, required: true }
      - { name: position, label: Position, type: string }
      - { name: department, label: Department, type: string }
      - { name: institution, label: University / institution, type: string }
      - { name: status, label: Opportunity line, type: string }
      - { name: hero_intro, label: Introduction paragraph, type: text }
      - { name: hero_body, label: Doctoral research paragraph, type: text }
      - { name: about_paragraph_2, label: Previous research paragraph, type: text }
      - name: profile_photo
        label: Profile photo (optional)
        type: image
        description: Upload a professional portrait. Leave blank for text-only header.
      - { name: location, label: Location, type: string }
      - { name: email, label: Email, type: string, required: true }
      - { name: scholar_url, label: Google Scholar, type: string }
      - { name: linkedin_url, label: LinkedIn, type: string }
      - name: cv_url
        label: CV PDF
        type: file
        options:
          extensions: [pdf]
      - { name: contact_body, label: Contact message, type: text }
      - { name: meta_description, label: Search description, type: text }
  - name: news
    label: 02 · Recent news
    type: file
    path: data/news.json
    format: json
    list: true
    fields:
      - { name: date, label: Date (e.g. Nov 2026), type: string, required: true }
      - { name: text, label: Announcement, type: text, required: true }
      - { name: url, label: Optional link, type: string }
      - { name: link_label, label: Optional link label, type: string }
  - name: projects
    label: 03 · Research projects
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - name: slug
        label: Project URL slug (unique, lowercase)
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      - { name: category, label: Research category, type: string }
      - { name: stage, label: Status, type: string }
      - { name: title, label: Project title, type: string, required: true }
      - { name: summary, label: Short project summary, type: text, required: true }
      - { name: contribution, label: My contribution (detail page), type: text }
      - { name: outcome, label: Findings & significance, type: text }
      - name: tags
        label: Research methods
        type: string
        list: true
      - name: cover_image
        label: Project image (optional; omitted until uploaded)
        type: image
      - { name: image_caption, label: Figure caption, type: text }
      - name: gallery
        label: Additional research figures
        type: image
        options:
          multiple:
            max: 8
      - { name: paper_url, label: Related publication URL, type: string }
      - { name: paper_label, label: Publication link label, type: string }
  - name: publications
    label: 04 · Publications
    type: file
    path: data/publications.json
    format: json
    list: true
    fields:
      - { name: year, label: Year, type: string }
      - { name: venue, label: Venue & role, type: string }
      - { name: title, label: Title, type: text, required: true }
      - { name: authors, label: Authors, type: text }
      - { name: url, label: DOI link, type: string }
  - name: education
    label: 05 · Education
    type: file
    path: data/education.json
    format: json
    list: true
    fields:
      - { name: degree, label: Degree, type: string }
      - { name: institution, label: Institution, type: string }
      - { name: detail, label: Date and adviser, type: string }
  - name: expertise
    label: 06 · Research skills
    type: file
    path: data/expertise.json
    format: json
    list: true
    fields:
      - { name: title, label: Category, type: string, required: true }
      - { name: description, label: Description, type: text }
      - name: tags
        label: Keywords (optional)
        type: string
        list: true
  - name: awards
    label: 07 · Awards
    type: file
    path: data/awards.json
    format: json
    list: true
    fields:
      - { name: text, label: Award, type: string }
